name: 每日自動更新主動式 ETF 儀表板

on:
  schedule:
    # 兩班都排在收盤(13:30)之後，這是 2026-08-08 實測的結論：
    # 多數投信早上公告 PCF，內容是前一交易日(T-1)的持股；少數(凱基/台新/中信)盤後
    # 才更新為當日(T)。早上那一份到了下午仍在原地，所以「下午跑」拿得到早上那批的
    # 同一份資料，還多拿到盤後才更新的那幾家——早上跑沒有任何獨佔的好處。
    # 佐證：週五 14:53 那次抓到的各檔資料日，到週六 16:55 再抓完全沒有一檔變新。
    #
    # GitHub scheduled workflows 為 best-effort，實測延遲 1-3 小時（設 09:17 實際
    # 12:03、設 13:47 實際 14:53），故排兩班互為備援；腳本冪等且有「資料日未更新
    # 就跳過」守則，重跑無害。
    - cron: "20 6 * * 1-5"   # 台灣 14:20 主跑（收盤後，實際約 15:20-17:20 觸發）
    - cron: "0 10 * * 1-5"   # 台灣 18:00 補跑（主跑失敗時當天仍補得回來）
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run adapter tests
        run: python -m unittest discover -s tests -q

      - name: Run update script
        run: python scripts/update_dashboard.py

      - name: Check for changes
        id: diff
        run: |
          # 先 stage 再比對，untracked 的每日快照（data/history/新檔）才會被偵測到
          git add index.html active.json data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Taipei date "+%Y/%m/%d %H:%M")
          git commit -m "auto: 更新主動式 ETF 持股與異動 ${DATE}"
          git push

      # Pages 部署間歇性失敗時 workflow 會綠燈但線上是舊資料（處置股儀表板已踩過兩次）。
      # **以內容雜湊 build_id 驗證，不是只比資料日**：同日修 UI 或補資料後，
      # 線上即使仍是舊版，資料日也會相同而誤判成功。HTML 與 active.json 各自比對。
      # 不符時依序：等待 → Pages API 重建 → 空 commit 觸發全新部署 → 仍失敗才亮紅燈。
      - name: Verify live deployment
        # fork 專用:這一步是拿「本 repo 產生的 build_id」去比對硬寫死的
        # nctuwanglin.github.io,在 fork 上永遠比不中,會空轉 7.5 分鐘、
        # 多推一個 empty commit、最後紅燈 —— 即使 active.json 其實已更新成功。
        # fork 不需要 GitHub Pages,直接跳過;只有原作者的 repo 才執行。
        if: github.repository_owner == 'nctuwanglin'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          URL="https://nctuwanglin.github.io/active-etf/"
          EXPECTED=$(grep -oE 'name="build-id" content="[0-9a-f]+"' index.html \
                     | grep -oE '[0-9a-f]{12}' | head -1)
          if [ -z "$EXPECTED" ]; then echo "::error::index.html 缺少 build-id"; exit 1; fi
          echo "預期 build_id: $EXPECTED"

          # HTML 與 JSON 都要對上才算部署成功
          check_live() {
            H=$(curl -fsS --max-time 20 "${URL}?nocache=$(date +%s)" 2>/dev/null \
                | grep -oE 'name="build-id" content="[0-9a-f]+"' \
                | grep -oE '[0-9a-f]{12}' | head -1)
            J=$(curl -fsS --max-time 20 "${URL}active.json?nocache=$(date +%s)" 2>/dev/null \
                | grep -oE '"build_id": *"[0-9a-f]+"' | grep -oE '[0-9a-f]{12}' | head -1)
            if [ -n "$H" ] && [ "$H" = "$J" ]; then echo "$H"; else echo "html=$H json=$J"; fi
          }

          poll() {  # poll <次數> <間隔秒>
            for i in $(seq 1 "$1"); do
              sleep "$2"
              LIVE=$(check_live || true)
              echo "  第 $i 次檢查: live='$LIVE'"
              if [ "$LIVE" = "$EXPECTED" ]; then return 0; fi
            done
            return 1
          }

          if poll 10 15; then echo "✅ 線上已是最新"; exit 0; fi

          echo "⚠️ 線上未更新，透過 Pages API 觸發重建..."
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          if poll 8 15; then echo "✅ 重建後已更新"; exit 0; fi

          echo "⚠️ 重建仍未生效，推空 commit 觸發全新部署..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 觸發 Pages 重新部署（自動補救）"
          git push
          if poll 12 15; then echo "✅ 空 commit 部署後已更新"; exit 0; fi

          echo "❌ 部署驗證失敗：線上仍為 '$(check_live || echo 無法取得)'，預期 '$EXPECTED'"
          exit 1
