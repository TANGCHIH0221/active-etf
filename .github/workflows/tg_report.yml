# 主動式 ETF 持股異動 → Telegram 推播。
#
# 2026-11-17 改版:fork 不再自己跑爬蟲(原本的 update.yml 已刪)。
# 上游 nctuwanglin/active-etf 每天自己抓 PCF 並 commit 資料,這支只做三件事:
#   1. 把上游的檔案原樣蓋進來(資料 + 程式,不含 .github)
#   2. 重建買賣日曆、發 Telegram 推播
#   3. 把同步結果與推播狀態 commit 回 main
# 起因:2026-10-14 ~ 11-16 fork 的爬蟲因為沒跟上游的修正,連續一個月當掉。
#
# ⚠️ 規則:fork 只能改「上游沒有的檔案」——
#     .github/  tg_common.py  tg_report.py  tg_state/  calendar/  .nojekyll
#   其餘檔案每次同步都會被上游版本覆蓋,改了也留不住。
#   (用覆蓋而不是 git merge:永遠不會衝突,而且 GITHUB_TOKEN 不能 push
#    動到 .github/workflows 的 commit,merge 上游歷史有被拒的風險。)
#
# 排程(cron 一律 UTC,台灣 = UTC+8)。上游資料實際進來的時間是台灣 23:00 ~
# 隔天 04:00(它的排程也被 GitHub 延遲),所以排五班涵蓋這段,哪班先拿到就先推。
# 重複推播靠 tg_state/state.json 去重;「資料該有卻沒有」的提醒在 tg_report.py
# 裡用日曆判斷(不看這班幾點跑),每個缺漏的資料日只提醒一次。
name: ETF 異動 Telegram 推播

on:
  schedule:
    # UTC 12/15/17/20/22 週一~五 = 台灣 20:00、23:00、隔天 01:00、04:00、06:00
    - cron: "0 12,15,17,20,22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式"
        type: choice
        default: normal
        options: [normal, force, dry-run, fail-test]

permissions:
  contents: write

# 兩班若被延遲到同時執行,排隊而不是並跑 —— 免得同時改 tg_state 又同時 push。
concurrency:
  group: tg-report
  cancel-in-progress: false

jobs:
  report:
    # 鎖版本:ubuntu-latest 2026-10-19 起換 Ubuntu 26,避免入伍後換版出事
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # 下面要 git pull --rebase,shallow clone 會出問題。repo 只有 3.5 MiB,
          # 抓完整歷史的成本可以忽略。
          fetch-depth: 0

      # 手動測試「失敗通知」用:故意失敗,讓最後的 Notify on failure 觸發
      - name: Simulated failure (fail-test)
        if: inputs.mode == 'fail-test'
        run: |
          echo "fail-test 模式:故意失敗以測試 TG 失敗通知"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest main
        run: git pull --rebase --autostash origin main

      # 把上游的檔案原樣蓋進來。git restore 會讓 pathspec 內的檔案與上游完全一致
      # (新增 / 修改 / 刪除都會跟),exclude 的是 fork 自己的檔案。
      # 抓不到上游就直接失敗 → 最後的 Notify on failure 會通知,下一班自動重試。
      - name: Sync from upstream
        id: sync
        run: |
          git fetch --depth=1 https://github.com/nctuwanglin/active-etf.git main
          UP=$(git rev-parse --short FETCH_HEAD)
          git restore --source=FETCH_HEAD --staged --worktree -- . \
            ':(exclude).github' ':(exclude)tg_common.py' ':(exclude)tg_report.py' \
            ':(exclude)tg_state' ':(exclude)calendar' ':(exclude).nojekyll'
          N=$(git status --porcelain | wc -l | tr -d ' ')
          echo "上游 $UP,同步後有 $N 個檔案變動"
          echo "upstream=$UP" >> "$GITHUB_OUTPUT"
          echo "changed=$N" >> "$GITHUB_OUTPUT"

      # 主動 ETF 買賣日曆(GitHub Pages:/calendar/)+ 推播裡的「連續買賣中」段落。
      # 日曆只是附加資訊,壞掉不能擋住主推播 → continue-on-error,
      # tg_report.py 讀不到 summary.json 時會自動省略該段。
      - name: Build calendar
        continue-on-error: true
        run: python calendar/build_calendar.py

      - name: Decide mode
        id: mode
        run: |
          FLAGS=""
          case "${{ inputs.mode }}" in
            force)   FLAGS="--force" ;;
            dry-run) FLAGS="--dry-run" ;;
          esac
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "本次執行參數: '$FLAGS'"

      - name: Send report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tg_report.py ${{ steps.mode.outputs.flags }}

      # 每次執行都會更新 state.json 的 last_run_utc,所以平日天天有 commit。
      # 公開 repo 連續 60 天沒有活動,GitHub 會自動停用排程 —— 這個心跳就是
      # 在當兵期間維持排程不被停用的保險。
      - name: Commit sync + state
        run: |
          git add -A -- . ':(exclude).github'
          if git diff --cached --quiet; then
            echo "沒有變化,不需 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.sync.outputs.changed }}" != "0" ]; then
            MSG="sync: 上游 ${{ steps.sync.outputs.upstream }} + 推播狀態"
          else
            MSG="chore(tg): 更新推播狀態與日曆"
          fi
          git commit -q -m "$MSG $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          # 手動 push 可能剛好撞上 —— 重試到成功。
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ 第 $i 次嘗試 push 成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次 push 失敗,拉取後重試"
            git pull --rebase --autostash origin main || true
            sleep $((i * 10))
          done
          echo "::error::push 連續 5 次失敗"
          exit 1

      # 在營區裡看不到 GitHub,壞掉一定要主動通知。這一步不依賴 tg_report.py,
      # 直接打 Telegram API —— 腳本本身壞掉時也發得出來。
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 換行用 printf 組,不能把續行頂格寫 —— 會跳出 run: | 區塊、整個 YAML 解析失敗。
          TEXT=$(printf '🚨 ETF 推播 workflow 失敗\n時間: %s (台灣)\n觸發: %s\nlog: %s' \
            "$(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')" "${{ github.event_name }}" "${RUN_URL}")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true" >/dev/null \
            && echo "已發送失敗通知" || echo "連失敗通知都發不出去"
